name: Build and Publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to build and publish
        required: true
        default: v1.3.10

permissions:
  contents: write

jobs:
  publish:
    name: Publish to CurseForge and Modrinth
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag_name }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Read mod metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag_name }}
          CURSEFORGE_TOKEN_VALUE: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN_VALUE: ${{ secrets.MODRINTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          get_property() {
            sed -n "s/^$1=//p" gradle.properties | head -n 1
          }

          echo "mod_id=$(get_property mod_id)" >> "$GITHUB_OUTPUT"
          echo "mod_version=$(get_property mod_version)" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$(get_property minecraft_version)" >> "$GITHUB_OUTPUT"

          version="$(get_property mod_version)"
          release_version="${RELEASE_TAG#v}"
          if [ "$version" != "$release_version" ]; then
            echo "Release tag v${release_version} does not match mod_version=${version}." >&2
            exit 1
          fi

          if [ -z "${{ vars.CURSEFORGE_PROJECT_ID }}" ] || [ -z "${{ vars.MODRINTH_PROJECT_ID }}" ]; then
            echo "CURSEFORGE_PROJECT_ID and MODRINTH_PROJECT_ID repository variables are required." >&2
            exit 1
          fi

          if [ -z "$CURSEFORGE_TOKEN_VALUE" ] || [ -z "$MODRINTH_TOKEN_VALUE" ]; then
            echo "CURSEFORGE_TOKEN and MODRINTH_TOKEN repository secrets are required." >&2
            exit 1
          fi

      - name: Build mod
        run: ./gradlew build --no-daemon

      - name: Upload jar to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag_name }}
          files: build/libs/${{ steps.metadata.outputs.mod_id }}-${{ steps.metadata.outputs.mod_version }}.jar
          fail_on_unmatched_files: true

      - name: Publish mod files
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/${{ steps.metadata.outputs.mod_id }}-${{ steps.metadata.outputs.mod_version }}.jar
          name: ${{ steps.metadata.outputs.mod_id }}-${{ steps.metadata.outputs.mod_version }}
          version: ${{ steps.metadata.outputs.mod_version }}
          version-type: release
          loaders: neoforge
          game-versions: ${{ steps.metadata.outputs.minecraft_version }}
          changelog: ${{ github.event.release.body }}
