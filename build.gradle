plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

import org.gradle.api.Action
import org.gradle.api.file.FileCopyDetails

class ExpandPropertiesAction implements Action<FileCopyDetails>, Serializable {
    private final Map<String, ?> properties

    ExpandPropertiesAction(Map<String, ?> properties) {
        this.properties = new LinkedHashMap<>(properties)
    }

    @Override
    void execute(FileCopyDetails details) {
        details.expand(properties)
    }
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version as int)
    }
    withSourcesJar()
}

configurations {
    localRuntime {
        exclude group: "mezz.jei"
    }
    clientLocalRuntime
    jeiRuntime
    runtimeClasspath.extendsFrom localRuntime
}

sourceSets {
    clientRuntime {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = (runtimeClasspath + sourceSets.main.runtimeClasspath + configurations.clientLocalRuntime + configurations.jeiRuntime)
    }
}

neoForge {
    version = neo_version

    accessTransformers = files('src/main/resources/META-INF/accesstransformer.cfg')

    mods {
        create(mod_id) {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }

    runs {
        client {
            client()
            gameDirectory = file('run/client')
            sourceSet = sourceSets.clientRuntime
            jvmArguments.add("-Dwcwt.debug.patternUpload=false")
        }
        server {
            server()
            gameDirectory = file('run/server')
            jvmArguments.add("-Dwcwt.debug.patternUpload=false")
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = "Jared's Maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "Curios Maven"
        url = "https://maven.theillusivec4.top/"
        content {
            includeGroup "top.theillusivec4.curios"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                url = "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth Maven"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

apply from: "$rootDir/dependencies.gradle"

tasks.named("processResources", ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(["META-INF/neoforge.mods.toml", "pack.mcmeta"], new ExpandPropertiesAction(replaceProperties))
}

tasks.named("jar", Jar).configure {
    manifest {
        attributes([
                "Specification-Title"   : mod_id,
                "Specification-Vendor"  : mod_authors,
                "Specification-Version" : "1",
                "Implementation-Title"  : project.name,
                "Implementation-Version": project.version,
                "Implementation-Vendor" : mod_authors
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
    testRuntimeOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
}

// Tests compile against optional-mod APIs, while runtime loads only core NeoForge/AE2/AE2WTLib mods.
sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}
