dependencies {
    // AE2 & AE2WTLib
    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    compileOnly "de.mari_023:ae2wtlib:${ae2wtlib_version}"

    // AE2 addons (26.1.2)
    compileOnly "maven.modrinth:extended-ae:${extendedae_modrinth}"
    compileOnly "maven.modrinth:glodium:${glodium_modrinth}"
    compileOnly "maven.modrinth:extendedae-plus:${extendedae_plus_modrinth}"
    compileOnly "maven.modrinth:advancedae:${advancedae_modrinth}"
    compileOnly "maven.modrinth:appflux:${appflux_modrinth}"
    compileOnly "maven.modrinth:neoecoae:${neoecoae_modrinth}"
    compileOnly "maven.modrinth:ae2helpers:${ae2helpers_modrinth}"
    compileOnly "maven.modrinth:ae2-lightning-tech:${ae2lt_modrinth}"

    // Cross-mod APIs (26.1.2)
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    compileOnly "maven.modrinth:inventory-profiles-next:${ipn_modrinth}"

    // Local runtime core mods
    localRuntime "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    localRuntime "org.appliedenergistics:guideme:${guideme_version}"
    localRuntime "de.mari_023:ae2wtlib:${ae2wtlib_version}"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    // Local runtime recipe viewer
    jeiRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}
